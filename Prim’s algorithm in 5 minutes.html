<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prim’s algorithm in 5 minutes</title>
<style>
:root{--bg:#eef2f5;--grid:#dbe3ea;--ink:#14213d;--mut:#586a80;--tree:#0e7c7b;--cand:#d98e04;--rej:#c8553d;--card:#fff;--line:#b8c4d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--grid:#1a2738;--ink:#e8eef5;--mut:#9fb0c3;--tree:#38c5c0;--cand:#f2b84b;--rej:#ef7f68;--card:#16222f;--line:#3a4b5f}}
:root[data-theme="dark"]{--bg:#0f1824;--grid:#1a2738;--ink:#e8eef5;--mut:#9fb0c3;--tree:#38c5c0;--cand:#f2b84b;--rej:#ef7f68;--card:#16222f;--line:#3a4b5f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
main{max-width:1020px;margin:0 auto;padding:20px 16px 32px}
h1{font:600 1.6rem/1.2 Georgia,"Iowan Old Style",serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.stage{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px}
svg{width:100%;height:auto;display:block}
.edge{stroke:var(--line);stroke-width:3;transition:stroke .4s,stroke-width .4s}
.edge.tree{stroke:var(--tree);stroke-width:7}
.edge.hl{stroke:var(--cand);stroke-width:7}
.edge.cand{stroke:var(--cand);stroke-width:3.5}
.edge.rej{stroke:var(--rej);stroke-width:2.5;stroke-dasharray:6 6}
.w{font:700 15px ui-sans-serif,system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--card);stroke-width:6px}
.v{fill:var(--card);stroke:var(--ink);stroke-width:2.5;transition:fill .4s,stroke .4s}
.v.in{fill:var(--tree);stroke:var(--tree)}
.vt{font:700 17px ui-sans-serif,system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central;transition:fill .4s}
.vt.in{fill:var(--card)}
h2{font-size:1rem;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
td.pick{color:var(--cand);font-weight:700}td.skip{color:var(--rej)}td.wait{color:var(--mut)}
.empty{color:var(--mut);margin:4px 0}
.cost{margin-top:12px;font-size:1.05rem}.cost b{color:var(--tree);font-size:1.5rem}
.cap{margin:16px 0 12px;min-height:7.5em;font:1.25rem/1.55 Georgia,"Iowan Old Style",serif;max-width:68ch}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 14px}
button.main{background:var(--ink);color:var(--bg);font-weight:600;min-width:90px}
button:focus-visible,input:focus-visible{outline:3px solid var(--cand);outline-offset:2px}
input[type=range]{flex:1;min-width:140px;accent-color:var(--tree)}
.time{font-variant-numeric:tabular-nums;color:var(--mut)}
.chap{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chap button{font-size:.85rem;padding:3px 10px;border-color:var(--line);color:var(--mut)}
.chap button.on{border-color:var(--tree);color:var(--tree);font-weight:700}
label{color:var(--mut);display:flex;gap:6px;align-items:center}
:root{--bg:#e9e4d8;--card:#f5f1e8;--ink:#1a1a18;--mut:#6a655b;--line:#bdb6a6;--tree:#a86f00;--cand:#3f7388;--cb:#3f7388;--rej:#b83222;--vig:rgba(0,0,0,.14);--grain:.12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--ink:#ece7dc;--mut:#9a948a;--line:#3b3a36;--tree:#f2c14e;--cand:#7fa9bd;--cb:#7fa9bd;--rej:#e0503f;--vig:rgba(0,0,0,.45);--grain:.09}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--ink:#ece7dc;--mut:#9a948a;--line:#3b3a36;--tree:#f2c14e;--cand:#7fa9bd;--cb:#7fa9bd;--rej:#e0503f;--vig:rgba(0,0,0,.45);--grain:.09}
body{background-image:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,var(--vig))}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--grain);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
h1{font-weight:400;letter-spacing:.14em;text-transform:lowercase;font-size:1.5rem}
.panel{border-radius:2px}
.vfw{position:relative;padding:20px 22px 18px}
.vfw::before{content:"";position:absolute;inset:8px;pointer-events:none;background:linear-gradient(var(--ink),var(--ink)) top left/22px 2px,linear-gradient(var(--ink),var(--ink)) top left/2px 22px,linear-gradient(var(--ink),var(--ink)) top right/22px 2px,linear-gradient(var(--ink),var(--ink)) top right/2px 22px,linear-gradient(var(--ink),var(--ink)) bottom left/22px 2px,linear-gradient(var(--ink),var(--ink)) bottom left/2px 22px,linear-gradient(var(--ink),var(--ink)) bottom right/22px 2px,linear-gradient(var(--ink),var(--ink)) bottom right/2px 22px;background-repeat:no-repeat}
.vf{display:flex;justify-content:space-between;gap:8px;font:12px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--mut);padding:0 0 8px}
.edge.hl{stroke:var(--ink)}.edge.cand{stroke:var(--cb)}
.edge.tree{filter:drop-shadow(0 0 5px var(--tree));animation:dev 1.4s ease-out}
@keyframes dev{from{opacity:.15}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.edge.tree{animation:none}}
td.pick{color:var(--tree)}
.cap{border-left:3px solid var(--tree);padding-left:16px}
button{border-radius:2px}
button.main{background:var(--tree);border-color:var(--tree);color:var(--card);border-radius:999px}
.chap{counter-reset:f;margin-top:18px;padding:18px 10px;gap:8px;border-radius:3px;background-color:#0d0d0c;background-image:repeating-linear-gradient(90deg,#cfc8b8 0 9px,transparent 9px 20px),repeating-linear-gradient(90deg,#cfc8b8 0 9px,transparent 9px 20px);background-size:100% 5px,100% 5px;background-position:left top 5px,left bottom 5px;background-repeat:no-repeat}
.chap button{counter-increment:f;background:#1b1b19;color:#cfc8b8;border:1px solid #33322e;border-radius:1px;padding:6px 10px;font-size:.8rem;display:flex;flex-direction:column;align-items:flex-start;min-width:84px}
.chap button::before{content:counter(f,decimal-leading-zero);font:10px ui-monospace,Menlo,monospace;color:#8b8578}
.chap button.on{border-color:#f2c14e;color:#f2c14e}
:root:root:root{--bg:#050709;--card:#0c1114;--ink:#f1ebe0;--mut:#8d9aa0;--line:#26343a;--tree:#ff9a3c;--cand:#3fc1c9;--cb:#3fc1c9;--rej:#c8442f;--vig:rgba(0,0,0,.6);--grain:.06;color-scheme:dark}
body{background:radial-gradient(ellipse at 50% 0,#0f1b20,#050709 70%)}
.stage{grid-template-columns:1fr}
.panel.screen{position:relative;padding:0;overflow:hidden;aspect-ratio:2/1;background:var(--card);border:1px solid #1c2a30;border-radius:2px}
@media (max-width:760px){.panel.screen{aspect-ratio:3/4}.screen svg{height:52%!important}}
.screen::before,.screen::after{content:"";position:absolute;left:0;right:0;height:6%;background:#000;z-index:3;border:0}
.screen::before{top:0;inset:0 0 auto 0;height:6%}.screen::after{bottom:0}
.vf{position:absolute;top:0;left:0;right:0;height:6%;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font:12px ui-monospace,Menlo,monospace;color:#9fb0b6;letter-spacing:.08em}
.screen svg{position:absolute;left:0;top:8%;width:100%;height:62%;transition:transform 2.6s cubic-bezier(.45,0,.2,1)}
.screen .cap{position:absolute;left:0;right:0;bottom:6%;margin:0;padding:36px 6% 12px;min-height:0;max-width:none;border:0;text-align:center;z-index:4;color:#fff;font:500 clamp(.85rem,1.7vw,1.15rem)/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-shadow:0 1px 3px #000;background:linear-gradient(transparent,rgba(0,0,0,.88) 45%)}
.card{position:absolute;inset:6% 0 28% 0;z-index:3;display:grid;place-content:center;gap:10px;text-align:center;background:rgba(2,9,11,.78);opacity:0;pointer-events:none;transition:opacity 1s}
.card.on{opacity:1}.card.end{background:rgba(2,9,11,.55)}
.card b{font:400 clamp(1.6rem,5vw,3.2rem)/1.1 Georgia,"Iowan Old Style",serif;letter-spacing:.22em;text-transform:lowercase;color:#f1ebe0}
.card i{font:italic 1rem Georgia,serif;color:#8d9aa0;letter-spacing:.08em}
.edge.hl{filter:drop-shadow(0 0 6px rgba(255,248,235,.6))}
.chap{flex-wrap:nowrap;gap:2px;padding:0;margin-top:14px;background:none;border-radius:0}
.chap button{flex:1 1 0;min-width:0;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:8px 6px;font-size:.72rem;background:#10181c;color:#8d9aa0;border:0;border-top:3px solid #26343a;border-radius:0;text-align:left}
.chap button::before{content:none}
.chap button.on{background:#17252b;color:var(--tree);border-top-color:var(--tree)}
@media (prefers-reduced-motion:reduce){.screen svg,.card{transition:none}}
</style></head><body><main>
<h1>Prim’s algorithm in 5 minutes</h1>
<p class="sub">Now showing: a short film in eleven scenes. Press play, or turn on the voice and listen along.</p>
<div class="stage">
 <div class="panel screen"><div class="vf"><span id="fr">Scene 01/11</span><span id="tc">00:00:00:00</span></div><div class="card on" id="card"></div><svg id="g" viewBox="0 0 620 340" role="img" aria-label="Weighted graph with six vertices A to F"></svg><p class="cap" id="cap" aria-live="polite"></p></div>
 <div class="panel"><h2>Cables to consider</h2><div id="tb"></div><div class="cost">Cost so far: <b id="cost">0</b></div></div>
</div>

<div class="ctl">
 <button class="main" id="pp">Play</button><button id="rs">Restart</button>
 <input type="range" id="sk" min="0" max="300" step="0.1" value="0" aria-label="Seek">
 <span class="time" id="tm">0:00 / 5:00</span>
 <label><input type="checkbox" id="vo"> Voice</label>
</div>
<div class="chap" id="ch"></div>
</main>
<script>
const V={A:[80,80],B:[290,45],C:[520,85],D:[110,280],E:[320,215],F:[540,290]};
const E=[["A","B",3],["A","D",1],["B","D",4],["B","C",2],["B","E",5],["C","E",6],["C","F",7],["D","E",8],["E","F",3]];
const W={};E.forEach(([a,b,w])=>W[a+b]=w);
const ALL=["AD","AB","BC","BE","EF"],SK=["BD","CE","DE","CF"];
const S=[
{n:"Intro",d:20,t:"Prim’s algorithm. In the next five minutes: what problem it solves, the one simple rule it follows, and a full step-by-step walkthrough on a small example.",te:[],c:[],r:[],h:null},
{n:"The problem",d:35,t:"Imagine six villages that must be connected by cables. Each possible cable has a cost, shown as a number on the line. You want every village connected for the lowest total cost, with no pointless loops. That cheapest connecting set is called a minimum spanning tree.",te:[],c:[],r:[],h:null},
{n:"The idea",d:30,t:"Here is the whole idea in one sentence. Start at any village. Then repeat: look at every cable leaving your connected group, and buy the cheapest one that reaches a new village. Stop when everyone is connected.",te:[],c:[],r:[],h:null},
{n:"Start at A",d:25,t:"Step one. Start at A. The cables leaving A cost 3 and 1. The cheapest is A to D, cost 1, so we pick it.",te:[],c:["AB"],r:[],h:"AD"},
{n:"Step 2",d:30,t:"D joins the group. The cables leaving the group are A to B for 3, D to B for 4, and D to E for 8. The cheapest is A to B at 3, so B joins next.",te:["AD"],c:["BD","DE"],r:[],h:"AB"},
{n:"Step 3",d:30,t:"B is in. Notice B to D, cost 4, is now crossed out: both ends are already connected, so it would only make a loop. The cheapest useful cable is B to C at 2.",te:["AD","AB"],c:["BE","DE"],r:["BD"],h:"BC"},
{n:"Step 4",d:30,t:"C joins. Options: B to E for 5, C to E for 6, C to F for 7, D to E for 8. We take B to E at 5. It is bigger than earlier picks, but it is the cheapest cable leaving the group right now, and that is all that matters.",te:["AD","AB","BC"],c:["CE","CF","DE"],r:["BD"],h:"BE"},
{n:"Step 5",d:35,t:"E joins, and a new cable appears: E to F at 3, much cheaper than C to F at 7. Cables C to E and D to E now link two villages already connected, so they are loops and get skipped. We pick E to F.",te:["AD","AB","BC","BE"],c:["CF"],r:["BD","CE","DE"],h:"EF"},
{n:"Result",d:25,t:"All six villages are connected using five cables. Total cost: 1 plus 3 plus 2 plus 5 plus 3, which is 14. A spanning tree always has one fewer edge than vertices, so we are done.",te:ALL,c:[],r:SK,h:null},
{n:"Why it works",d:25,t:"Why does it work? At every step, the cheapest cable leaving the group is always safe to keep. For speed, store candidate cables in a priority queue. The running time is about E log V.",te:ALL,c:[],r:SK,h:null},
{n:"Recap",d:15,t:"Recap: start anywhere, grow one village at a time, and always take the cheapest cable that reaches somewhere new.",te:ALL,c:[],r:SK,h:null}
];
const $=id=>document.getElementById(id);
const st=[];let acc=0;S.forEach(s=>{st.push(acc);acc+=s.d});const T=acc;
let h="";
E.forEach(([a,b])=>h+=`<line id="e${a+b}" class="edge" x1="${V[a][0]}" y1="${V[a][1]}" x2="${V[b][0]}" y2="${V[b][1]}"/>`);
E.forEach(([a,b,w])=>h+=`<text class="w" x="${(V[a][0]+V[b][0])/2}" y="${(V[a][1]+V[b][1])/2}">${w}</text>`);
Object.entries(V).forEach(([n,[x,y]])=>h+=`<circle id="v${n}" class="v" cx="${x}" cy="${y}" r="21"/><text id="t${n}" class="vt" x="${x}" y="${y}">${n}</text>`);
$("g").innerHTML=h;
$("ch").innerHTML=S.map((s,i)=>`<button data-i="${i}" style="flex:${s.d} 1 0">${s.n}</button>`).join("");
const nm=k=>k[0]+"–"+k[1];
let t=0,play=false,last=0,cur=-1;
function idx(x){let i=0;while(i<S.length-1&&x>=st[i+1])i++;return i}
function render(i){
 const s=S[i],inT=new Set(i>=3?["A"]:[]);
 s.te.forEach(k=>{inT.add(k[0]);inT.add(k[1])});
 E.forEach(([a,b])=>{const k=a+b;let c="edge";
  if(s.te.includes(k))c+=" tree";else if(s.h===k)c+=" hl";else if(s.c.includes(k))c+=" cand";else if(s.r.includes(k))c+=" rej";
  $("e"+k).setAttribute("class",c)});
 Object.keys(V).forEach(n=>{const o=inT.has(n)?" in":"";$("v"+n).setAttribute("class","v"+o);$("t"+n).setAttribute("class","vt"+o)});
 let rows=[];
 if(s.h)rows.push([s.h,"Pick","pick"]);
 s.c.slice().sort((a,b)=>W[a]-W[b]).forEach(k=>rows.push([k,"Not cheapest","wait"]));
 s.r.forEach(k=>rows.push([k,"Skip: loop","skip"]));
 $("tb").innerHTML=rows.length?"<table><tr><th>Cable</th><th>Cost</th><th>Decision</th></tr>"+rows.map(r=>`<tr><td>${nm(r[0])}</td><td>${W[r[0]]}</td><td class="${r[2]}">${r[1]}</td></tr>`).join("")+"</table>":`<p class="empty">${i<3?"Nothing chosen yet.":"All cables decided."}</p>`;
 $("cost").textContent=s.te.reduce((a,k)=>a+W[k],0);
 $("cap").textContent=s.t;$("fr").textContent="Scene "+String(i+1).padStart(2,"0")+"/"+S.length;card(i);cam(s);
 document.querySelectorAll(".chap button").forEach((b,j)=>b.classList.toggle("on",j===i));
}
function cam(s){const g=$("g");let sc=1,fx=310,fy=170;
 if(s.h){const a=V[s.h[0]],b=V[s.h[1]];fx=(a[0]+b[0])/2;fy=(a[1]+b[1])/2;sc=1.35}
 const w=g.clientWidth,hh=g.clientHeight,k=Math.min(w/620,hh/340);
 g.style.transformOrigin=((w-620*k)/2+fx*k)+"px "+((hh-340*k)/2+fy*k)+"px";g.style.transform="scale("+sc+")"}
function card(i){const c=$("card"),end=i===S.length-1;
 c.className="card"+(i===0?" on":end?" on end":"");
 c.innerHTML=i===0?"<b>prim’s algorithm</b><i>a short film in eleven scenes</i>":end?"<b>fin</b><i>starring vertices A to F</i>":""}
function speak(i){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 if($("vo").checked&&play){const u=new SpeechSynthesisUtterance(S[i].t);u.rate=1;speechSynthesis.speak(u)}
}
const f=x=>Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0");
function show(){
 const i=idx(t);
 if(i!==cur){cur=i;render(i);speak(i)}
 $("sk").value=t;$("tc").textContent="00:"+[Math.floor(t/60),Math.floor(t%60),Math.floor(t%1*24)].map(x=>String(x).padStart(2,"0")).join(":");$("tm").textContent=f(t)+" / "+f(T);
}
function tick(now){
 if(!play)return;
 t+=(now-last)/1000;last=now;
 if(t>=T){t=T-0.01;play=false;$("pp").textContent="Replay";show();return}
 show();requestAnimationFrame(tick);
}
function go(){
 if(t>=T-0.5){t=0;cur=-1}
 play=true;$("pp").textContent="Pause";last=performance.now();
 if("speechSynthesis" in window&&speechSynthesis.paused&&$("vo").checked)speechSynthesis.resume();else speak(idx(t));
 requestAnimationFrame(tick);
}
function stop(){play=false;$("pp").textContent="Play";if("speechSynthesis" in window)speechSynthesis.pause()}
$("pp").onclick=()=>play?stop():go();
$("rs").onclick=()=>{if("speechSynthesis" in window)speechSynthesis.cancel();t=0;cur=-1;show();go()};
$("sk").oninput=e=>{t=+e.target.value;cur=-1;show()};
$("ch").onclick=e=>{const b=e.target.closest("button");if(!b)return;t=st[+b.dataset.i];cur=-1;show()};
$("vo").onchange=()=>{if(!$("vo").checked&&"speechSynthesis" in window)speechSynthesis.cancel();else if(play)speak(idx(t))};
show();
</script></body></html>
